# GitHub Pages: interaktive Konfigurator-Site (PDF im Browser).
# Deployment-Branch ist gh-pages. Jeder Push dorthin baut _site und veröffentlicht sie.
# Einmalig im GitHub-Repo: Settings → Pages → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Site zusammenstellen
        run: |
          mkdir -p _site/fonts
          cp docs/index.html docs/generate.js docs/.nojekyll _site/
          cp docs/fonts/*.ttf _site/fonts/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
